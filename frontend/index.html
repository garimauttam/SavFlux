<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SavFlux — code review and an agent workspace over your own repositories, on free local models."
    />
    <title>SavFlux — Agent workspace for your code</title>
    <script>
      // Apply the stored theme before first paint.
      //
      // This has to be an inline script, not a React effect: a hook runs after
      // the first commit, so the app would paint in the wrong theme and then
      // correct itself — a visible flash on every load, and a fully light flash
      // for anyone whose stored preference is dark. Reading one localStorage
      // key here costs nothing and removes the flash entirely.
      (function () {
        try {
          var v = localStorage.getItem("savflux:theme");
          var dark =
            v === "dark" ||
            ((!v || v === "system") &&
              !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches));
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the compiled JS bundle here -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
