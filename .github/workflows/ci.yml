name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest ──────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          # CI secrets — provide dummy values so Pydantic settings validation passes.
          # Tests mock all real external calls (LLM, ChromaDB) so these are never used.
          #
          # LLM_PROVIDER=openai here is deliberate and not interchangeable with the
          # app's `ollama` default. The `openai` path uses OpenAIEmbeddings, so it
          # never imports sentence-transformers. On the ollama path, any test that
          # reaches get_embedding_fn() tries to fetch all-MiniLM-L6-v2 from
          # HuggingFace — and on a sandbox without egress that is 5 retries with
          # exponential backoff (~30s per affected test) rather than a failure.
          # The suite goes from "apparent hang" to ~5s because of this line.
          # Local runs need it too: see README's testing section.
          LLM_PROVIDER: openai
          OPENAI_API_KEY: sk-ci-placeholder
        run: python -m pytest -v --tb=short

  # ── Backend: RAG eval (self-benchmark) ──────────────────────────────────────
  # Runs the 42-query benchmark against the backend source as the corpus.
  # Fails the CI if Hit Rate drops below 40% (regression guard).
  rag-eval:
    name: RAG Benchmark (self-eval)
    runs-on: ubuntu-latest
    # Run only on push to main to keep PR checks fast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run RAG benchmark
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: sk-ci-placeholder
        # --embedder offline --no-rerank keeps this job offline and fast.
        #   `offline`  : a deterministic hashing embedder, no model download. It
        #                exercises the dense branch's plumbing; its numbers are NOT
        #                a measure of retrieval quality and the report says so.
        #   `--no-rerank`: without it, each query retries a cross-encoder download
        #                with exponential backoff before the failure path disables
        #                it, turning a 2-second run into several minutes and
        #                corrupting the latency metric.
        run: |
          python eval_rag.py --quiet --embedder offline --no-rerank --json-out eval_results.json
          echo "=== Benchmark Results ==="
          cat eval_results.json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          m = d['metrics']
          for leg, v in m['by_leg'].items():
              if v.get('hit_rate_at_k') is None:
                  print(f'  {leg:<16s} {v[\"note\"]}')
              else:
                  print(f'  {leg:<16s} hit@5={v[\"hit_rate_at_k\"]:>5.1f}%  '
                        f'mrr={v[\"mean_reciprocal_rank_mrr\"]:.3f}  '
                        f'symbols={v[\"symbol_recall_pct\"]:>5.1f}%')
          print(f'  dense leg embedder: {m[\"dense_leg_embedder\"]}')
          print(f'  avg latency: {m[\"avg_latency_ms\"]} ms/query')
          e = d['evaluation']
          print('  corpus: ' + str(e['corpus_shape']) + ' shape, '+ str(e['dense_corpus']['units']) + ' units')
          print('  hit rate is ' + str(m['hit_rate_at_k_granularity']) + '-level (a unit of the expected file)')
          hr = m['hit_rate_at_k']
          if hr < 40:
              print(f'FAIL: Hit Rate {hr}% is below the 40% regression threshold.')
              sys.exit(1)
          print(f'PASS: Hit Rate {hr}% meets the 40% threshold.')
          "

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark-results
          path: eval_results.json
          retention-days: 30

  # ── Frontend: TypeScript type-check + unit tests ────────────────────────────
  frontend-typecheck:
    name: Frontend TypeScript + Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      # The UI has its own suite (vitest + jsdom): the tab strip, section
      # reachability, and the light-theme invariants. Type-checking alone could
      # not see the defect that motivated it — 17 tabs in a strip that clipped
      # the last five off-screen compiles perfectly.
      - name: Frontend unit tests
        run: npm test

      # A production build, then the budget that splitting exists to protect. `vite
      # build` prints every chunk it emitted; this measures the narrower thing — the
      # bytes a browser must have before it can paint, walked from the manifest's
      # static imports. A dependency that drags 200 kB onto the critical path, or a
      # diff that un-lazies the graph panel, is invisible to tsc and to every unit
      # test here, and would otherwise ship quietly.
      # `report:bundle` prints the full per-chunk table for the PR log.
      - name: Bundle budget (first paint, gzipped)
        run: |
          npx vite build
          node scripts/bundle-report.mjs --entry-budget-kb 320
