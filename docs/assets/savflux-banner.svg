<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">SavFlux — Code review that shows its work</title>
  <desc id="desc">A violet SavFlux mark and three connected nodes representing code, evidence, and approval on a dark background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111322"/><stop offset="1" stop-color="#19142c"/></linearGradient>
    <linearGradient id="mark" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="218" rx="22" fill="url(#background)" stroke="#39334c"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="40" y="43" width="68" height="68" rx="19" fill="url(#mark)"/>
    <text x="74" y="91" text-anchor="middle" fill="#fff" font-size="44" font-weight="700">S</text>
    <text x="128" y="98" fill="#f5f3ff" font-size="58" font-weight="700" letter-spacing="-2">SavFlux</text>
    <text x="42" y="160" fill="#d4cfea" font-size="25">Code review that shows its work.</text>
    <path d="M601 81H750M750 81V144H837" stroke="#6d6586" stroke-width="2" fill="none"/>
    <circle cx="578" cy="81" r="24" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <path d="M572 73L564 81L572 89M584 73L592 81L584 89" stroke="#bfdbfe" stroke-width="2.5" fill="none"/>
    <circle cx="727" cy="81" r="24" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
    <path d="M718 81L724 87L737 74" stroke="#ccfbf1" stroke-width="3" fill="none"/>
    <circle cx="860" cy="144" r="24" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <path d="M855 136L863 144L855 152M847 144H870" stroke="#fde68a" stroke-width="2.5" fill="none"/>
    <text x="578" y="127" text-anchor="middle" fill="#bfdbfe" font-size="18">Code</text>
    <text x="727" y="127" text-anchor="middle" fill="#99f6e4" font-size="18">Evidence</text>
    <text x="860" y="192" text-anchor="middle" fill="#fde68a" font-size="18">Approval</text>
  </g>
</svg>
